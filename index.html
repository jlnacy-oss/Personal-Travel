<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Travel Atlas</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root{
    --ink:#1B3A3F; --paper:#F4F5F1; --panel:#FFFFFF; --rule:#D4DAD4;
    --water:#BFDFF0; --land:#F1F3E9; --border:#8FA096; --sub:#B3C0B6;
    --city:#C2382E; --sight:#A8791A; --nature:#3C7A3A;
    --text:#17282B; --muted:#5E7073;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--paper);color:var(--text);
    font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
  .serif{font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif}

  header.top{padding:14px 18px 12px;background:var(--paper);border-bottom:1px solid var(--rule)}
  header.top h1{margin:0;font-size:26px;font-weight:400;letter-spacing:.01em}
  .tally{margin:4px 0 0;font-size:13.5px;color:var(--muted)}
  .tally b{color:var(--ink);font-weight:600}

  .stage{position:relative;background:var(--water)}
  #map{height:56vh;min-height:330px;width:100%;background:var(--water);z-index:1}
  .maptools{position:absolute;z-index:600;right:12px;bottom:14px;display:flex;gap:8px}
  .maptools button{border:1px solid var(--rule);background:rgba(255,255,255,.93);color:var(--ink);
    border-radius:999px;padding:7px 13px;font-size:12.5px;cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.12)}
  .maptools button:hover{border-color:var(--ink)}
  .legend{position:absolute;z-index:600;left:12px;top:12px;background:rgba(255,255,255,.92);
    border:1px solid var(--rule);border-radius:9px;padding:8px 11px;font-size:12px;color:var(--muted);
    box-shadow:0 1px 4px rgba(0,0,0,.1);line-height:1.9}
  .legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px;vertical-align:middle}

  .lbl{font-size:11px;color:#5B6E66;white-space:nowrap;text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 3px #fff;
    font-weight:500;pointer-events:none}
  .lbl.country{font-size:12.5px;color:#42565A;letter-spacing:.04em}
  .lbl.place{font-size:11.5px;color:#1F3438;font-weight:600}

  .controls{padding:16px 16px 6px;max-width:1180px;margin:0 auto}
  .search{width:100%;padding:12px 14px;border:1px solid var(--rule);border-radius:10px;
    background:var(--panel);font-size:16px;color:var(--text)}
  .search:focus{outline:2px solid var(--ink);outline-offset:1px;border-color:transparent}
  .chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:11px}
  .chip{border:1px solid var(--rule);background:var(--panel);color:var(--muted);
    border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer}
  .chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
  .chip:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
  .resultline{margin:13px 2px 0;font-size:13px;color:var(--muted)}

  .list{max-width:1180px;margin:0 auto;padding:8px 16px 60px}
  .country{margin-top:26px}
  .country > h2{display:flex;align-items:baseline;justify-content:space-between;gap:10px;
    margin:0 0 2px;padding-bottom:7px;border-bottom:1.5px solid var(--ink);font-size:20px;font-weight:500}
  .country > h2 span{font-size:12.5px;color:var(--muted);font-family:inherit;letter-spacing:.03em}
  .row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:0;
    border-bottom:1px solid var(--rule);padding:13px 4px;cursor:pointer;font:inherit;color:inherit}
  .row:hover{background:rgba(27,58,63,.06)}
  .row:focus-visible{outline:2px solid var(--ink);outline-offset:-2px}
  .row .glyph{width:13px;flex:0 0 13px;text-align:center;font-size:12px;color:var(--city)}
  .row.sight .glyph{color:var(--sight)} .row.nature .glyph{color:var(--nature)}
  .row .name{flex:1}
  .row .kind{font-size:12px;color:var(--muted)}
  .row .kind.reps{color:var(--ink);font-weight:600}
  .row .kind.lived{color:#8A5A12;font-weight:600;letter-spacing:.02em}
  .row.on{background:rgba(168,121,26,.16)}

  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:900;transform:translateY(101%);
    transition:transform .28s cubic-bezier(.22,.7,.3,1);background:var(--panel);border-top:3px solid var(--ink);
    border-radius:16px 16px 0 0;box-shadow:0 -12px 40px rgba(23,40,43,.22);
    padding:18px 18px calc(18px + env(safe-area-inset-bottom));max-height:72vh;overflow:auto}
  .sheet.open{transform:translateY(0)}
  .sheet h3{margin:0;font-size:23px;font-weight:400}
  .sheet .meta{color:var(--muted);font-size:13px;margin:4px 0 14px}
  .sheet .close{position:absolute;top:14px;right:16px;border:0;background:none;font-size:22px;color:var(--muted);cursor:pointer;line-height:1}
  .linkrow{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}
  .linkrow a{border:1px solid var(--rule);border-radius:999px;padding:6px 13px;font-size:13px;
    color:var(--ink);text-decoration:none;background:#fff}
  .linkrow a:hover{border-color:var(--ink)}
  .sights{list-style:none;margin:0 0 12px;padding:0}
  .sights li{display:flex;gap:9px;align-items:center;padding:8px 0;border-bottom:1px solid var(--rule);font-size:15px}
  .sights li button{margin-left:auto;border:0;background:none;color:var(--muted);cursor:pointer;font-size:12.5px}
  .empty{color:var(--muted);font-size:14px;margin:0 0 12px}
  .addrow{display:flex;gap:8px}
  .addrow input{flex:1;padding:10px 12px;border:1px solid var(--rule);border-radius:9px;font-size:16px}
  .addrow button{border:0;background:var(--ink);color:#fff;border-radius:9px;padding:10px 16px;font-size:14px;cursor:pointer}

  .banner{background:#FCF3DA;border-bottom:1px solid #E3D3A4;padding:12px 16px;display:flex;
    gap:12px;align-items:center;flex-wrap:wrap;font-size:14px}
  .banner p{margin:0;flex:1;min-width:200px}
  .filebtn{border:1px solid var(--ink);color:var(--ink);background:none;border-radius:9px;
    padding:9px 14px;font-size:14px;cursor:pointer;display:inline-block}
  .datafile{max-width:1180px;margin:0 auto;padding:6px 16px 70px}
  .datafile h2{font-size:19px;font-weight:500;margin:0 0 6px;padding-bottom:7px;border-bottom:1.5px solid var(--ink)}
  .datafile p{font-size:13.5px;color:var(--muted);margin:0 0 13px}
  .dfbtns{display:flex;gap:9px;flex-wrap:wrap;align-items:center}
  .dfbtns button{border:0;background:var(--ink);color:#fff;border-radius:9px;padding:10px 15px;font-size:14px;cursor:pointer}
  .dfbtns button.ghost{background:none;border:1px solid var(--ink);color:var(--ink)}
  .field{margin:0 0 11px}
  .field label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:4px}
  .field input,.field select{width:100%;padding:10px 12px;border:1px solid var(--rule);border-radius:9px;font-size:16px;background:#fff}
  .two{display:flex;gap:10px} .two .field{flex:1}
  .dirty{color:#8A5A12;font-weight:600}
  @media (prefers-reduced-motion:reduce){.sheet{transition:none}}
  @media (min-width:900px){#map{height:62vh} header.top h1{font-size:32px}}
  .leaflet-popup-content{margin:11px 14px;font-size:14px}
  .leaflet-popup-content em{color:#5E7073;font-style:normal;display:block;font-size:12.5px;margin-top:2px}
  .leaflet-container{background:var(--water)}
</style>
</head>
<body>

<header class="top">
  <h1 class="serif">Where I&rsquo;ve been</h1>
  <p class="tally" id="tally"></p>
</header>

<div class="banner" id="banner" hidden>
  <p id="bannerMsg"></p>
  <label class="filebtn">Import data file<input type="file" id="importFile" accept=".js,.json,application/json,text/javascript" hidden></label>
</div>

<div class="stage">
  <div id="map"></div>
  <div class="legend">
    <div><i style="background:#C2382E"></i>City</div>
    <div><i style="background:#A8791A"></i>Monument or sight</div>
    <div><i style="background:#3C7A3A"></i>Park or landscape</div>
  </div>
  <div class="maptools">
    <button id="addpin">Add pin</button>
    <button id="terrain">Terrain</button>
    <button id="fit">Fit to results</button>
    <button id="reset">World</button>
  </div>
</div>

<div class="controls">
  <input class="search" id="q" type="search" placeholder="Search a place or country" autocomplete="off">
  <div class="chips" id="regionChips"></div>
  <div class="chips" id="typeChips"></div>
  <p class="resultline" id="resultline"></p>
</div>

<div class="list" id="list"></div>

<section class="datafile">
  <h2 class="serif">Your data file</h2>
  <p id="dataState">All pins come from travel-data.js, sitting next to this page.</p>
  <div class="dfbtns">
    <button id="exportDl">Download updated file</button>
    <button id="exportCopy">Copy file contents</button>
    <label class="filebtn">Import a file<input type="file" id="importFile2" accept=".js,.json,application/json,text/javascript" hidden></label>
  </div>
</section>

<div class="sheet" id="addSheet" role="dialog" aria-labelledby="addTitle">
  <button class="close" id="addClose" aria-label="Close">&times;</button>
  <h3 class="serif" id="addTitle">Add a pin</h3>
  <p class="meta">Tap <b>Place on map</b>, then tap where it belongs. Or type coordinates.</p>
  <div class="field"><label for="pName">Name</label><input id="pName" placeholder="Colosseum"></div>
  <div class="field"><label for="pCountry">Country</label><input id="pCountry" list="countryList" placeholder="Italy"><datalist id="countryList"></datalist></div>
  <div class="two">
    <div class="field"><label for="pRegion">Region</label><select id="pRegion"></select></div>
    <div class="field"><label for="pType">Kind</label><select id="pType">
      <option value="sight">Monument or sight</option><option value="city">City</option>
      <option value="nature">Park or landscape</option></select></div>
  </div>
  <div class="field"><label for="pCity">Part of which city? (optional, for monuments)</label><input id="pCity" list="cityList" placeholder="London"><datalist id="cityList"></datalist></div>
  <div class="two">
    <div class="field"><label for="pLat">Latitude</label><input id="pLat" inputmode="decimal" placeholder="41.890"></div>
    <div class="field"><label for="pLng">Longitude</label><input id="pLng" inputmode="decimal" placeholder="12.492"></div>
  </div>
  <div class="field"><label for="pVisits">Times visited (optional)</label><input id="pVisits" inputmode="numeric" placeholder="1"></div>
  <div class="dfbtns">
    <button id="pPick" class="ghost">Place on map</button>
    <button id="pSave">Add pin</button>
  </div>
  <p class="meta" id="addNote"></p>
</div>

<div class="sheet" id="sheet" role="dialog" aria-modal="false" aria-labelledby="sheetName">
  <button class="close" id="sheetClose" aria-label="Close">&times;</button>
  <h3 class="serif" id="sheetName"></h3>
  <p class="meta" id="sheetMeta"></p>
  <div class="linkrow" id="sheetLinks"></div>
  <ul class="sights" id="sheetSights"></ul>
  <p class="empty" id="sheetEmpty">No sights recorded here yet.</p>
  <div class="addrow">
    <input id="sightInput" placeholder="Add a monument or sight" autocomplete="off">
    <button id="sightAdd">Add</button>
  </div>
</div>

<script src="travel-data.js"></script>

let D=[];
let dirty=false;
function bootData(places){
  D=places.map((p,i)=>Object.assign({},p,{id:i,sights:Array.isArray(p.sights)?p.sights.slice():[]}));
}
function banner(msg){
  const b=document.getElementById('banner');
  document.getElementById('bannerMsg').textContent=msg;
  b.hidden=false;
}
if(window.TRAVEL_DATA&&Array.isArray(window.TRAVEL_DATA.places)&&window.TRAVEL_DATA.places.length){
  bootData(window.TRAVEL_DATA.places);
}else{
  banner('travel-data.js did not load. Keep both files in the same folder, or import the data file here.');
}
const KIND={city:"City",sight:"Monument or sight",nature:"Park or landscape"};
const PLURAL={city:"Cities",sight:"Monuments & sights",nature:"Parks & landscapes"};
const GLYPH={city:"\u25CF",sight:"\u25C6",nature:"\u25B2"};
const COLOR={city:"#C2382E",sight:"#A8791A",nature:"#3C7A3A"};

/* ---------- map ---------- */
const map=L.map('map',{zoomControl:false,worldCopyJump:true,minZoom:1,maxZoom:16,
  maxBounds:[[-85,-260],[85,260]],maxBoundsViscosity:.85}).setView([28,-30],2);
L.control.zoom({position:'bottomleft'}).addTo(map);

// panes keep the basemap under the pins
map.createPane('base');   map.getPane('base').style.zIndex=200;   map.getPane('base').style.pointerEvents='none';
map.createPane('labels'); map.getPane('labels').style.zIndex=650; map.getPane('labels').style.pointerEvents='none';

const toFeat=a=>a.map(f=>({type:'Feature',geometry:{type:f.t,coordinates:f.c},properties:{}}));
const countryLayer=L.geoJSON(toFeat(GEO.countries),{pane:'base',interactive:false,
  style:{fillColor:'#EDF2E4',fillOpacity:1,color:'#8FA096',weight:.9}});
const stateLayer=L.geoJSON(toFeat(GEO.states),{pane:'base',interactive:false,
  style:{fillColor:'#EDF2E4',fillOpacity:1,color:'#A8B7AC',weight:.7,dashArray:'3,3'}});
const lakeLayer=L.geoJSON(toFeat(HYDRO.lakes),{pane:'base',interactive:false,
  style:{fillColor:'#BFDFF0',fillOpacity:1,color:'#9CC9E0',weight:.5}});
const riverLayer=L.geoJSON(toFeat(HYDRO.rivers),{pane:'base',interactive:false,
  style:{color:'#A9D2E8',weight:.9,fill:false}});
const vectorBase=[countryLayer,lakeLayer,riverLayer];
vectorBase.forEach(l=>l.addTo(map));

// Live terrain tiles: shaded relief and greenery. Loads where the network allows it,
// and falls back to the built-in vector map when it doesn't.
const terrain=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}',
  {maxZoom:16,attribution:'Esri, USGS, NOAA'});
let terrainOn=false, terrainDead=false;
const tBtn=document.getElementById('terrain');
terrain.on('tileerror',()=>{ if(!terrainDead && terrainOn){ terrainDead=true; setTerrain(false); tBtn.textContent='Terrain unavailable'; tBtn.disabled=true; tBtn.style.opacity=.55; }});
function setTerrain(on){
  terrainOn=on;
  if(on){ terrain.addTo(map); vectorBase.forEach(l=>map.removeLayer(l)); map.removeLayer(stateLayer); }
  else{ map.removeLayer(terrain); vectorBase.forEach(l=>l.addTo(map)); }
  tBtn.textContent = on ? 'Plain map' : 'Terrain';
  zoomLayers();
}
tBtn.onclick=()=>{ if(!terrainDead) setTerrain(!terrainOn); };
function label(lat,lng,text,cls){
  return L.marker([lat,lng],{pane:'labels',interactive:false,
    icon:L.divIcon({className:'lbl '+cls,html:text,iconSize:[0,0]})});
}
const countryLabels=L.layerGroup(GEO.clabels.map(l=>label(l[1],l[0],l[2],'country')));
const stateLabels=L.layerGroup(GEO.slabels.map(l=>label(l[1],l[0],l[2],'')));
const placeLabels=L.layerGroup();

function zoomLayers(){
  const z=map.getZoom();
  (!terrainOn && z>=4) ? stateLayer.addTo(map) : map.removeLayer(stateLayer);
  (!terrainOn && z<=4) ? countryLabels.addTo(map) : map.removeLayer(countryLabels);
  (!terrainOn && z>=4) ? stateLabels.addTo(map) : map.removeLayer(stateLabels);
  z>=6 ? placeLabels.addTo(map) : map.removeLayer(placeLabels);
}
map.on('zoomend',zoomLayers);

const layer=L.layerGroup().addTo(map);
const markers={};
function drawMarkers(rows){
  layer.clearLayers(); placeLabels.clearLayers();
  rows.forEach(d=>{
    const rep=d.lived?9:d.visits?Math.min(4+Math.sqrt(d.visits)*1.3,9):d.stay?7:null;
    const m=L.circleMarker([d.lat,d.lng],{radius:rep||(d.t==='city'?5:6),color:d.lived?'#1B3A3F':'#fff',
      weight:d.lived?2:1.4,fillColor:COLOR[d.t],fillOpacity:.95})
      .bindPopup(`<strong>${esc(d.n)}</strong><em>${d.city?esc(d.city)+', ':''}${esc(d.c)} &middot; ${KIND[d.t]}`+
        (d.lived?' &middot; '+esc(d.lived):d.visits?` &middot; ${d.visits} trips`+(d.stay?', '+esc(d.stay):''):d.stay?' &middot; '+esc(d.stay):'')+`</em>`);
    m.on('click',()=>openSheet(d.id));
    m.addTo(layer); markers[d.id]=m;
    placeLabels.addLayer(L.marker([d.lat,d.lng],{pane:'labels',interactive:false,
      icon:L.divIcon({className:'lbl place',html:esc(d.n),iconSize:[0,0],iconAnchor:[-9,-2]})}));
  });
}

/* ---------- state ---------- */
let region='All', types=new Set(['city','sight','nature']), q='';
const filtered=()=>{const s=q.trim().toLowerCase();
  return D.filter(d=>(region==='All'||d.r===region)&&types.has(d.t)&&
    (!s||d.n.toLowerCase().includes(s)||d.c.toLowerCase().includes(s)));};
const childSights=d=>D.filter(x=>x.t==='sight'&&x.city===d.n&&x.c===d.c);
const sightCount=d=>childSights(d).length+d.sights.length;
const esc=x=>String(x).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const regions=['All',...[...new Set(D.map(d=>d.r))].sort()];
const rc=document.getElementById('regionChips');
regions.forEach(r=>{const b=document.createElement('button');
  b.className='chip';b.textContent=r;b.setAttribute('aria-pressed',r==='All');
  b.onclick=()=>{region=r;[...rc.children].forEach(c=>c.setAttribute('aria-pressed',c===b));render();};
  rc.appendChild(b);});
const tc=document.getElementById('typeChips');
Object.keys(KIND).forEach(t=>{const b=document.createElement('button');
  b.className='chip';b.textContent=PLURAL[t];b.setAttribute('aria-pressed','true');
  b.onclick=()=>{if(types.has(t)&&types.size>1){types.delete(t);b.setAttribute('aria-pressed','false');}
    else{types.add(t);b.setAttribute('aria-pressed','true');} render();};
  tc.appendChild(b);});
document.getElementById('q').oninput=e=>{q=e.target.value;render();};

function render(){
  const rows=filtered();
  drawMarkers(rows); zoomLayers();
  const countries=[...new Set(rows.map(d=>d.c))].sort();
  document.getElementById('resultline').textContent = !D.length
    ? 'No data loaded yet. Import your travel-data.js, or drop your first pin with Add pin.'
    : rows.length
    ? `${rows.length} showing across ${countries.length} ${countries.length===1?'country':'countries'}`
    : 'Nothing matches those filters. Clear the search or turn a category back on.';
  const list=document.getElementById('list'); list.innerHTML='';
  countries.forEach(c=>{
    const sec=document.createElement('section'); sec.className='country';
    const h=document.createElement('h2'); h.className='serif';
    const inC=rows.filter(d=>d.c===c);
    const cs=(window.TRAVEL_DATA&&window.TRAVEL_DATA.countryStats||{})[c];
    let csTxt='';
    if(cs){ const bits=[]; if(cs.visits) bits.push(cs.visits+(cs.visits>1?' trips':' trip'));
      if(cs.time) bits.push(cs.time); if(cs.note) bits.push(cs.note); csTxt=' &middot; '+esc(bits.join(', ')); }
    h.innerHTML=`${esc(c)}<span>${inC.length}${csTxt}</span>`; sec.appendChild(h);
    inC.forEach(d=>{const b=document.createElement('button');
      b.className='row '+d.t; b.dataset.id=d.id;
      const sc=sightCount(d);
      const badge = d.lived ? '<span class="kind lived">lived here</span>'
        : d.visits ? `<span class="kind reps">&times;${d.visits}</span>`
        : d.tag ? `<span class="kind reps">${esc(d.tag)}</span>`
        : d.stay ? '<span class="kind reps">often</span>' : '';
      b.innerHTML=`<span class="glyph">${GLYPH[d.t]}</span><span class="name">${esc(d.n)}</span>`+badge+
        (sc?`<span class="kind">${sc} sight${sc>1?'s':''}</span>`:
         d.t==='sight'&&d.city?`<span class="kind">${esc(d.city)}</span>`:
         d.t!=='city'?`<span class="kind">${KIND[d.t]}</span>`:'');
      b.onclick=()=>{openSheet(d.id);flyTo(d);};
      sec.appendChild(b);});
    list.appendChild(sec);});
  const totalSights=D.reduce((a,d)=>a+d.sights.length,0)+D.filter(d=>d.t!=='city').length;
  void totalSights;
  document.getElementById('tally').innerHTML=
    `<b>${D.length}</b> places &middot; <b>${new Set(D.map(d=>d.c)).size}</b> countries &middot; <b>${totalSights}</b> sights and landscapes`;
}
function flyTo(d){map.flyTo([d.lat,d.lng],Math.max(map.getZoom(),7),{duration:.7});
  const m=markers[d.id]; if(m) setTimeout(()=>m.openPopup(),420);}
document.getElementById('fit').onclick=()=>{const rows=filtered(); if(!rows.length)return;
  map.fitBounds(L.latLngBounds(rows.map(d=>[d.lat,d.lng])),{padding:[40,40],maxZoom:7});};
document.getElementById('reset').onclick=()=>map.setView([28,-30],2);

/* ---------- detail sheet ---------- */
let current=null;
const sheet=document.getElementById('sheet');
function openSheet(id){current=D[id];
  document.getElementById('sheetName').textContent=current.n;
  const q=encodeURIComponent(current.n+(current.city?' '+current.city:' '+current.c));
  const lr=document.getElementById('sheetLinks');
  lr.innerHTML=`<a href="https://en.wikipedia.org/wiki/Special:Search?search=${q}&go=Go" target="_blank" rel="noopener">Wikipedia</a>`+
    `<a href="https://www.google.com/search?tbm=isch&q=${q}" target="_blank" rel="noopener">Photos</a>`+
    `<a href="https://www.google.com/maps/search/?api=1&query=${current.lat},${current.lng}" target="_blank" rel="noopener">Maps</a>`;
  const extra = current.lived ? ' · '+current.lived
    : current.visits ? ' · '+current.visits+' trips'+(current.stay?', '+current.stay:'')
    : current.stay ? ' · '+current.stay : '';
  document.getElementById('sheetMeta').textContent=
    `${current.c} · ${KIND[current.t]}${extra} · ${current.lat.toFixed(3)}, ${current.lng.toFixed(3)}`;
  paintSights(); sheet.classList.add('open');
  document.querySelectorAll('.row').forEach(r=>r.classList.toggle('on',+r.dataset.id===id));}
function paintSights(){const ul=document.getElementById('sheetSights'); ul.innerHTML='';
  childSights(current).forEach(s=>{
    const li=document.createElement('li');
    li.innerHTML=`<span style="color:#A8791A">\u25C6</span><span>${esc(s.n)}</span>`;
    const go=document.createElement('button'); go.textContent='Show';
    go.onclick=()=>{openSheet(s.id);flyTo(s);};
    li.appendChild(go); ul.appendChild(li);});
  current.sights.forEach((s,i)=>{const li=document.createElement('li');
    li.innerHTML=`<span style="color:#A8791A">\u25C6</span><span>${esc(s)}</span>`;
    const del=document.createElement('button'); del.textContent='Remove';
    del.onclick=()=>{current.sights.splice(i,1);markDirty();paintSights();render();};
    li.appendChild(del); ul.appendChild(li);});
  const em=document.getElementById('sheetEmpty');
  if(current.t==='sight'){
    em.style.display='block';
    em.innerHTML=current.city?'Part of '+esc(current.city)+'.':'';
    if(!current.city) em.style.display='none';
  }else{
    em.textContent='No sights recorded here yet.';
    em.style.display=sightCount(current)?'none':'block';
  }
  document.getElementById('sightInput').placeholder=
    current.t==='sight'?'Add a note about this place':'Add a monument or sight';}
document.getElementById('sightAdd').onclick=addSight;
document.getElementById('sightInput').onkeydown=e=>{if(e.key==='Enter')addSight()};
function addSight(){const i=document.getElementById('sightInput'); const v=i.value.trim();
  if(!v||!current)return; current.sights.push(v); markDirty(); i.value=''; paintSights(); render();}
document.getElementById('sheetClose').onclick=()=>{sheet.classList.remove('open');
  document.querySelectorAll('.row.on').forEach(r=>r.classList.remove('on'));};


/* ---------- add pin ---------- */
const addSheet=document.getElementById('addSheet');
const REGIONS=['Africa','Asia','Caribbean','Central America','Europe','Middle East','North America','Oceania','South America'];
let tempMarker=null;

function fillPickers(){
  const dl=document.getElementById('countryList');
  dl.innerHTML=[...new Set(D.map(d=>d.c))].sort().map(c=>`<option value="${esc(c)}">`).join('');
  const cl=document.getElementById('cityList');
  if(cl) cl.innerHTML=D.filter(d=>d.t==='city').map(d=>`<option value="${esc(d.n)}">`).join('');
  const rs=document.getElementById('pRegion');
  const known=[...new Set(D.map(d=>d.r))];
  const all=[...new Set([...REGIONS,...known])].sort();
  rs.innerHTML=all.map(r=>`<option>${esc(r)}</option>`).join('');
  rs.value='Europe';
}
document.getElementById('addpin').onclick=()=>{fillPickers();addSheet.classList.add('open');
  document.getElementById('addNote').textContent='';};
document.getElementById('addClose').onclick=()=>{addSheet.classList.remove('open');clearTemp();};
function clearTemp(){ if(tempMarker){map.removeLayer(tempMarker);tempMarker=null;} map.getContainer().style.cursor=''; }

document.getElementById('pPick').onclick=()=>{
  addSheet.classList.remove('open');
  map.getContainer().style.cursor='crosshair';
  document.getElementById('addNote').textContent='';
  map.once('click',e=>{
    document.getElementById('pLat').value=e.latlng.lat.toFixed(4);
    document.getElementById('pLng').value=e.latlng.lng.toFixed(4);
    clearTemp();
    tempMarker=L.circleMarker(e.latlng,{radius:7,color:'#1B3A3F',weight:2,fillColor:'#fff',fillOpacity:1}).addTo(map);
    addSheet.classList.add('open');
  });
};

document.getElementById('pSave').onclick=()=>{
  const g=id=>document.getElementById(id).value.trim();
  const n=g('pName'), c=g('pCountry'), lat=parseFloat(g('pLat')), lng=parseFloat(g('pLng'));
  const note=document.getElementById('addNote');
  if(!n||!c){ note.textContent='Name and country are both needed.'; return; }
  if(isNaN(lat)||isNaN(lng)||Math.abs(lat)>90||Math.abs(lng)>180){ note.textContent='Place it on the map, or enter valid coordinates.'; return; }
  const rec={n,c,r:g('pRegion'),t:g('pType'),lat,lng,sights:[],id:D.length};
  const pc=g('pCity'); if(pc) rec.city=pc;
  const pv=parseInt(g('pVisits'),10); if(pv>0) rec.visits=pv;
  D.push(rec);
  ['pName','pLat','pLng','pCity','pVisits'].forEach(i=>document.getElementById(i).value='');
  clearTemp(); markDirty(); render();
  note.textContent=n+' added. Add another, or close when you are done.';
};

/* ---------- data file ---------- */
function dataFileText(){
  const places=D.map(d=>{const o={n:d.n,c:d.c,r:d.r,t:d.t,lat:d.lat,lng:d.lng};
    if(d.city)o.city=d.city; if(d.visits)o.visits=d.visits; if(d.stay)o.stay=d.stay; if(d.tag)o.tag=d.tag;
    if(d.lived)o.lived=d.lived; o.sights=d.sights; return o;});
  const stamp=new Date().toISOString().slice(0,10);
  const cs=(window.TRAVEL_DATA&&window.TRAVEL_DATA.countryStats)||{};
  return '// Travel Atlas data file. Keep this next to travel-atlas.html.\n'+
         '// Edit by hand, or use Add pin in the dashboard and export a fresh copy.\n'+
         'window.TRAVEL_DATA = '+JSON.stringify({updated:stamp,countryStats:cs,places},null,1)+';\n';
}
function markDirty(){
  dirty=true;
  document.getElementById('dataState').innerHTML=
    '<span class="dirty">Unsaved changes.</span> Download or copy the file and replace your travel-data.js to keep them.';
}
document.getElementById('exportDl').onclick=()=>{
  const b=new Blob([dataFileText()],{type:'text/javascript'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(b); a.download='travel-data.js'; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),4000);
};
document.getElementById('exportCopy').onclick=async e=>{
  try{ await navigator.clipboard.writeText(dataFileText()); e.target.textContent='Copied'; }
  catch(err){ e.target.textContent='Copy blocked — use Download'; }
  setTimeout(()=>{e.target.textContent='Copy file contents';},2500);
};
function handleImport(file){
  const fr=new FileReader();
  fr.onload=()=>{
    try{
      let s=String(fr.result);
      const i=s.indexOf('{'), j=s.lastIndexOf('}');
      const obj=JSON.parse(s.slice(i,j+1));
      const places=Array.isArray(obj)?obj:obj.places;
      if(!Array.isArray(places)||!places.length) throw new Error('no places');
      bootData(places); dirty=false;
      document.getElementById('banner').hidden=true;
      document.getElementById('dataState').textContent='Loaded '+places.length+' pins from '+file.name+'.';
      render(); document.getElementById('fit').click();
    }catch(err){
      document.getElementById('dataState').textContent='That file could not be read. It needs to be the travel-data.js this page exports.';
    }
  };
  fr.readAsText(file);
}
['importFile','importFile2'].forEach(id=>{
  const el=document.getElementById(id);
  if(el) el.onchange=e=>{ if(e.target.files[0]) handleImport(e.target.files[0]); };
});

render();
setTerrain(true);
map.whenReady(()=>setTimeout(()=>map.invalidateSize(),200));
</script>
